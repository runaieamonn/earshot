# /etc/turnserver.conf — Earshot TURN template (rendered by deploy/install.sh from /etc/earshot.env)
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=__EARSHOT_TURN_SECRET__
realm=__EARSHOT_DOMAIN__
no-multicast-peers
no-tcp-relay
no-cli
# prevent SSRF / relaying into loopback, link-local, or RFC1918 private ranges
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# quota sanity
user-quota=16
total-quota=100
max-bps=128000
bps-capacity=0
